<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Google Fonts: loaded here (not via JS @import) so font requests start immediately
         instead of waiting for the JS bundle to load, parse, and inject a <style> tag. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#1f3a7d" />
    <meta name="description" content="1-on-1 finance, Excel and AI coaching from a Brisbane-based qualified accountant. Coaching in Brisbane and online across Australia. Book a free discovery call." />
    <meta name="author" content="Aaron Pacheco" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APP Coaching" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="https://appcoaching.io/" />
    <meta property="og:title" content="Finance, Excel &amp; AI Coaching in Brisbane | APP Coaching" />
    <meta property="og:description" content="1-on-1 finance, Excel and AI coaching from a Brisbane-based qualified accountant. Coaching in Brisbane and online across Australia. Book a free discovery call." />
    <meta property="og:image" content="https://appcoaching.io/Aaron_Pacheco_300dpi_001_6x6.jpg" />
    <meta property="og:image:alt" content="Aaron Pacheco, founder of APP Coaching" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Finance, Excel &amp; AI Coaching in Brisbane | APP Coaching" />
    <meta name="twitter:description" content="1-on-1 finance, Excel and AI coaching from a Brisbane-based qualified accountant. Coaching in Brisbane and online across Australia. Book a free discovery call." />
    <meta name="twitter:image" content="https://appcoaching.io/Aaron_Pacheco_300dpi_001_6x6.jpg" />

    <!-- Google Site Verification & Analytics -->
    <meta name="google-site-verification" content="yi5jdpycQ4YPGxXSuWdH3vUpoVVGPuFO-RMCbwCybgc" />

    <!-- Canonical URL (prevents duplicate content issues) -->
    <link rel="canonical" href="https://appcoaching.io/" />

    <!-- Blog feed (RSS) — generated at build time by scripts/generate-static-shells.js -->
    <link rel="alternate" type="application/rss+xml" title="APP Coaching Blog" href="https://appcoaching.io/feed.xml" />

    <!--
      Note: no JSON-LD here on purpose. Every page's schema is baked into its static HTML at
      build time by scripts/generate-static-shells.js (as <script id="schema-page">), and
      src/App.jsx updates that same element on client-side navigation.
    -->

    <title>Finance, Excel &amp; AI Coaching in Brisbane | APP Coaching</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Hidden static form for Netlify Forms detection.
      Netlify's build-time bot scans the built HTML for <form> tags to register them —
      it cannot see forms rendered client-side by React. This hidden replica has the
      same name and field names as the real React contact form, so Netlify registers
      "contact" as a valid form and routes AJAX submissions from the real form to it.
      Do not remove: without this, contact form submissions silently fail.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="interest"><option>placeholder</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
